<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Traffic Dodge</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
body{display:flex;justify-content:center;align-items:center}
#game{position:relative;width:min(100vw,520px);height:100vh;overflow:hidden;background:#28763c;touch-action:none}
#road{position:absolute;left:12%;right:12%;top:0;bottom:0;background:#45484d}
.edge{position:absolute;top:0;bottom:0;width:6px;background:#fff;z-index:2}
.edge.l{left:12%}.edge.r{right:12%}
#lines{position:absolute;inset:0;z-index:1;pointer-events:none}
.line{position:absolute;width:6px;height:110px;background:#fff;border-radius:3px}
#hud{position:absolute;z-index:20;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;color:#fff;font-weight:900}
.badge{background:#0009;padding:8px 12px;border-radius:14px}
.car{position:absolute;width:48px;height:82px;border-radius:12px;z-index:6;box-shadow:0 5px 12px #0009}
.car .window{position:absolute;left:8px;right:8px;top:10px;height:27px;background:#a9c8d0;border:2px solid #e8faff;border-radius:8px}
.car .bottom{position:absolute;left:8px;right:8px;bottom:8px;height:15px;background:#151515;border-radius:4px}
.wheel{position:absolute;width:7px;height:19px;background:#111;border-radius:4px;z-index:2}
.w1{left:-4px;top:14px}.w2{right:-4px;top:14px}.w3{left:-4px;bottom:14px}.w4{right:-4px;bottom:14px}
.signal{position:absolute;top:6px;width:8px;height:8px;border-radius:50%;background:#4b2100;z-index:3}
.signal.l{left:4px}.signal.r{right:4px}
.signal.on{background:#ffad00;box-shadow:0 0 10px #ff8b00}
.tail{position:absolute;bottom:3px;width:7px;height:5px;background:#f22;border-radius:2px}
.tail.l{left:5px}.tail.r{right:5px}
#player{position:absolute;width:48px;height:82px;bottom:42px;z-index:8;border-radius:12px;background:#1598ff;box-shadow:0 6px 14px #0009}
#player .window{position:absolute;left:8px;right:8px;top:10px;height:27px;background:#bfeeff;border:2px solid #efffff;border-radius:8px}
#player .bottom{position:absolute;left:8px;right:8px;bottom:8px;height:15px;background:#0863a8;border-radius:4px}
.screen{position:absolute;inset:0;z-index:30;background:#000b;color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.screen h1{font-size:50px;line-height:.9;margin:0 0 12px;letter-spacing:-3px}
.screen p{opacity:.8;margin:0 0 24px}
button{border:0;border-radius:18px;padding:15px 26px;font-size:18px;font-weight:900;background:#20a9ff;color:#06121d;cursor:pointer}
#gameover{display:none}
</style>
</head>
<body>
<div id="game">
  <div id="road"></div><div class="edge l"></div><div class="edge r"></div><div id="lines"></div>
  <div id="hud"><div class="badge">SCORE <span id="score">0</span></div><div class="badge">BEST <span id="best">0</span></div></div>
  <div id="player"></div>
  <div id="start" class="screen"><h1>TRAFFIC<br>DODGE</h1><p>Dodge traffic and survive.</p><button id="startBtn">START DRIVING</button></div>
  <div id="gameover" class="screen"><h1>CRASH!</h1><p>Score: <b id="final">0</b></p><button id="againBtn">DRIVE AGAIN</button></div>
</div>
<script>
(function(){
"use strict";
var game=document.getElementById("game"), player=document.getElementById("player");
var lines=document.getElementById("lines"), scoreEl=document.getElementById("score");
var bestEl=document.getElementById("best"), start=document.getElementById("start");
var over=document.getElementById("gameover"), finalEl=document.getElementById("final");
var running=false,score=0,best=0,speed=4.7,last=0,spawn=0,lineMove=0;
var px=50,target=50,traffic=[],pointerDown=false;

try{best=Number(localStorage.getItem("trafficDodgeBest")||0)}catch(e){best=0}
bestEl.textContent=best;

function lane(n){return 12+(n+.5)*(76/3)}
function buildLines(){
  lines.innerHTML="";
  for(var n=1;n<=2;n++)for(var i=0;i<10;i++){
    var d=document.createElement("div");d.className="line";
    d.style.left=(12+n*(76/3)-.6)+"%";d.style.top=(i*125-180)+"px";
    lines.appendChild(d);
  }
}
buildLines();

function carHTML(){
 return '<span class="window"></span><span class="bottom"></span>'+
 '<span class="wheel w1"></span><span class="wheel w2"></span>'+
 '<span class="wheel w3"></span><span class="wheel w4"></span>'+
 '<span class="signal l"></span><span class="signal r"></span>'+
 '<span class="tail l"></span><span class="tail r"></span>';
}

function spawnCar(){
 var red=Math.random()<.20, ln=Math.floor(Math.random()*3), c=document.createElement("div");
 c.className="car";c.innerHTML=carHTML();
 if(red)c.style.background="#d71920";
 else {var v=Math.floor(Math.random()*256);c.style.background="rgb("+v+","+v+","+v+")"}
 game.appendChild(c);
 var o={el:c,red:red,lane:ln,x:lane(ln),target:lane(ln),y:-100,
        signaling:false,switching:false,dir:0,timer:red?250+Math.random()*500:0,blink:0};
 c.style.left="calc("+o.x+"% - 24px)";c.style.top="-100px";traffic.push(o);
}

function overlap(a,b){
 var A=a.getBoundingClientRect(),B=b.getBoundingClientRect();
 return !(A.right-7<B.left||A.left+7>B.right||A.bottom-7<B.top||A.top+7>B.bottom);
}

function stop(){
 running=false;
 if(score>best){best=Math.floor(score);try{localStorage.setItem("trafficDodgeBest",best)}catch(e){}bestEl.textContent=best}
 finalEl.textContent=Math.floor(score);over.style.display="flex";
}

function startGame(){
 traffic.forEach(function(o){o.el.remove()});traffic=[];
 score=0;speed=4.7;spawn=0;lineMove=0;px=50;target=50;
 player.style.left="calc(50% - 24px)";scoreEl.textContent="0";
 start.style.display="none";over.style.display="none";running=true;last=performance.now();
 requestAnimationFrame(loop);
}

function loop(now){
 if(!running)return;
 var dt=Math.min((now-last)/16.67,2);last=now;
 speed+=.0012*dt;score+=.12*dt;scoreEl.textContent=Math.floor(score);

 px+=(target-px)*.18*dt;player.style.left="calc("+px+"% - 24px)";

 lineMove+=speed*dt;
 document.querySelectorAll(".line").forEach(function(d,i){
   var y=i%10*125-180+(lineMove%1250);if(y>game.clientHeight+120)y-=1250;d.style.top=y+"px";
 });

 spawn+=dt*16.67;
 var interval=Math.max(360,820-speed*42);
 if(spawn>interval){spawn=0;spawnCar()}

 for(var i=traffic.length-1;i>=0;i--){
   var o=traffic[i];

   if(o.red){
     o.timer-=dt*16.67;

     if(!o.signaling&&!o.switching&&o.timer<=0){
       var opts=[];if(o.lane>0)opts.push(-1);if(o.lane<2)opts.push(1);
       if(opts.length){
         o.dir=opts[Math.floor(Math.random()*opts.length)];
         o.signaling=true;o.timer=550;o.blink=0;
       }else o.timer=700;
     }

     if(o.signaling){
       o.blink+=dt*16.67;
       var sig=o.dir<0?o.el.querySelector(".signal.l"):o.el.querySelector(".signal.r");
       sig.classList.toggle("on",Math.floor(o.blink/220)%2===0);
       if(o.timer<=0){
         o.signaling=false;o.switching=true;o.target=lane(o.lane+o.dir);o.blink=0;
       }
     }

     if(o.switching){
       o.blink+=dt*16.67;
       var sig2=o.dir<0?o.el.querySelector(".signal.l"):o.el.querySelector(".signal.r");
       sig2.classList.toggle("on",Math.floor(o.blink/220)%2===0);
       o.x+=(o.target-o.x)*.055*dt;
       if(Math.abs(o.x-o.target)<.35){
         o.lane+=o.dir;o.x=o.target;o.switching=false;o.timer=900+Math.random()*1100;
         o.el.querySelector(".signal.l").classList.remove("on");
         o.el.querySelector(".signal.r").classList.remove("on");
       }
     }
   }

   o.y+=speed*dt;o.el.style.left="calc("+o.x+"% - 24px)";o.el.style.top=o.y+"px";
   if(overlap(player,o.el)){stop();return}
   if(o.y>game.clientHeight+100){o.el.remove();traffic.splice(i,1)}
 }
 requestAnimationFrame(loop);
}

function move(clientX){
 var r=game.getBoundingClientRect();target=Math.max(15,Math.min(85,(clientX-r.left)/r.width*100));
}
game.addEventListener("pointerdown",function(e){if(running){pointerDown=true;move(e.clientX)}});
game.addEventListener("pointermove",function(e){if(running&&pointerDown)move(e.clientX)});
window.addEventListener("pointerup",function(){pointerDown=false});
window.addEventListener("keydown",function(e){
 if(!running)return;
 if(e.key==="ArrowLeft"||e.key==="a")target=Math.max(15,target-9);
 if(e.key==="ArrowRight"||e.key==="d")target=Math.min(85,target+9);
});
document.getElementById("startBtn").onclick=startGame;
document.getElementById("againBtn").onclick=startGame;
})();
</script>
</body>
</html>
